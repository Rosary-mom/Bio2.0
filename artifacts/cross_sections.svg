<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 11px; fill: #222; }
      .dim { font-family: Arial, sans-serif; font-size: 9px; fill: #555; }
      .section { fill: #f8f5eb; stroke: #333; stroke-width: 1.5; }
      .payload { fill: #a67c3d; fill-opacity: 0.35; stroke: #8b5e3c; stroke-width: 1; }
      .frangible { fill: none; stroke: #c9302c; stroke-width: 2; stroke-dasharray: 3,2; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="420" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#222">Querschnitte 5mm × 5mm Projektil-Designs</text>
  
  <!-- DESIGN A: Frangible Ogive -->
  <g transform="translate(50, 60)">
    <text x="110" y="-12" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Design A: Frangible Ogive Capsule</text>
    
    <!-- Outer body -->
    <rect x="20" y="20" width="180" height="50" rx="3" class="section"/>
    
    <!-- Payload chamber -->
    <rect x="55" y="28" width="110" height="34" class="payload"/>
    
    <!-- Frangible nose area -->
    <path d="M20 20 L55 20 L55 62 L20 62" fill="#fee" stroke="#c9302c" stroke-width="2"/>
    <text x="35" y="45" class="dim" transform="rotate(-90 35 45)">Frangible</text>
    
    <!-- Dimensions -->
    <line x1="20" y1="85" x2="200" y2="85" stroke="#333" stroke-width="1"/>
    <line x1="20" y1="82" x2="20" y2="88" stroke="#333" stroke-width="1"/>
    <line x1="200" y1="82" x2="200" y2="88" stroke="#333" stroke-width="1"/>
    <text x="110" y="100" text-anchor="middle" class="dim">5,0 mm</text>
    
    <line x1="210" y1="20" x2="210" y2="70" stroke="#333" stroke-width="1"/>
    <text x="225" y="48" class="dim" transform="rotate(90 225 48)">5,0 mm</text>
    
    <!-- Labels -->
    <text x="110" y="48" text-anchor="middle" class="label">Payload-Kammer</text>
    <text x="37" y="78" class="dim">0,35mm Wand</text>
  </g>
  
  <!-- DESIGN B: Inertial Piston -->
  <g transform="translate(320, 60)">
    <text x="110" y="-12" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Design B: Inertial Piston Injector</text>
    
    <!-- Outer shell -->
    <rect x="20" y="20" width="180" height="50" rx="3" class="section"/>
    
    <!-- Payload in front -->
    <rect x="55" y="25" width="55" height="40" class="payload"/>
    
    <!-- Piston (heavy slug) -->
    <rect x="115" y="25" width="70" height="40" fill="#666" stroke="#222" stroke-width="1"/>
    <text x="150" y="48" text-anchor="middle" fill="#fff" font-size="9">Piston</text>
    
    <!-- Orifice at tip -->
    <rect x="20" y="38" width="8" height="14" fill="#c9302c"/>
    
    <!-- Dimensions -->
    <line x1="20" y1="85" x2="200" y2="85" stroke="#333" stroke-width="1"/>
    <text x="110" y="100" text-anchor="middle" class="dim">5,0 mm</text>
    
    <text x="110" y="115" text-anchor="middle" class="dim">Inertial-Masse treibt Payload bei Impact nach vorne</text>
  </g>
  
  <!-- DESIGN C: Boat-Tail -->
  <g transform="translate(50, 200)">
    <text x="110" y="-12" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Design C: Boat-Tail Shear Valve (beste Aerodynamik)</text>
    
    <!-- Main body + boat tail -->
    <path d="M20 20 L180 20 L200 55 L180 70 L20 70 Z" class="section"/>
    
    <!-- Payload chamber -->
    <rect x="50" y="28" width="105" height="34" class="payload"/>
    
    <!-- Shear tabs indication -->
    <line x1="50" y1="25" x2="50" y2="65" stroke="#c9302c" stroke-width="2" stroke-dasharray="2,1"/>
    <line x1="155" y1="25" x2="155" y2="65" stroke="#c9302c" stroke-width="2" stroke-dasharray="2,1"/>
    
    <!-- Boat tail detail -->
    <text x="190" y="52" class="dim">Boat-Tail</text>
    
    <!-- Dimensions -->
    <line x1="20" y1="85" x2="200" y2="85" stroke="#333" stroke-width="1"/>
    <text x="110" y="100" text-anchor="middle" class="dim">5,0 mm Gesamtlänge</text>
    
    <text x="110" y="118" text-anchor="middle" class="dim">Cd ≈ 0,45 | Bessere Reichweite &amp; geringere Streuung</text>
  </g>
  
  <g transform="translate(320, 200)">
    <text x="110" y="20" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Maßstab &amp; Hinweise</text>
    <text x="20" y="45" class="label">• Alle Designs: 5,0 mm Ø</text>
    <text x="20" y="62" class="label">• Nutzbares Payload-Volumen ≈ 40–55 mm³</text>
    <text x="20" y="79" class="label">• Mindestwandstärke 0,35–0,45 mm (Druckbarkeit)</text>
    <text x="20" y="96" class="label">• Frangible / Shear-Bereiche rot markiert</text>
    <text x="20" y="113" class="label">• Payload (braun) wird nur bei Impact freigesetzt</text>
  </g>
</svg>