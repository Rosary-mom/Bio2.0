:"./avatars/avatar-education.svg","vaultId":"Wegweiser/EDUCATION.md","cluster":"wegweiser"},{"id":"WW-OPTI","label":"Opti-Steer","role":"Prozessoptimierung","kind":"agent","status":"wach","avatar":"./avatars/avatar-optisteer.svg","vaultId":"Wegweiser/Opti-Steer.md","cluster":"wegweiser"},{"id":"RKW-RI","label":"RI","role":"RKW-Innovation","kind":"scout","status":"schläft","avatar":"./avatars/avatar-RI.jpg","vaultId":"RKW-Scouts/RI.md","cluster":"rkw"},{"id":"RKW-UC","label":"UC","role":"Uni-Campus","kind":"scout","status":"schläft","avatar":"./avatars/avatar-UC.jpg","vaultId":"RKW-Scouts/UC.md","cluster":"rkw"},{"id":"RKW-LLE","label":"LLE","role":"Live & Learn & Earn","kind":"scout","status":"schläft","avatar":"./avatars/avatar-LLE.jpg","vaultId":"RKW-Scouts/LLE.md","cluster":"rkw"},{"id":"RKW-SAL","label":"SAL","role":"Sales-Channels","kind":"scout","status":"schläft","avatar":"./avatars/avatar-SAL.jpg","vaultId":"RKW-Scouts/SAL.md","cluster":"rkw"},{"id":"RKW-ML","label":"ML","role":"MicroLiving","kind":"scout","status":"schläft","avatar":"./avatars/avatar-ML.jpg","vaultId":"RKW-Scouts/ML.md","cluster":"rkw"}],"interactions":[{"from":"GB-RDIR","to":"GB-FIDELIO","label":"Folge 1 v8 · Bild","kind":"handoff"},{"from":"GB-FIDELIO","to":"GB-ARCHY","label":"Folge 1 v8 · Ton-Mix","kind":"handoff"},{"from":"GB-ARCHY","to":"GB-RDIR","label":"Nachcheck v8b","kind":"handoff"},{"from":"GB-REGIE","to":"GB-RDIR","label":"Übergabe","kind":"handoff"},{"from":"SC-06","to":"GB-REGIE","label":"Wachhund","kind":"watch"},{"from":"GB-DATEN","to":"M4","label":"Bericht","kind":"handoff"},{"from":"GB-REGIE","to":"GB-MARVIN","label":"Abstimmung","kind":"handoff"},{"from":"GB-REGIE","to":"GB-FIDELIO","label":"Koordination","kind":"link"},{"from":"GB-REGIE","to":"GB-ARCHY","label":"Koordination","kind":"link"},{"from":"GB-REGIE","to":"GB-DATEN","label":"Koordination","kind":"link"},{"from":"GB-REGIE","to":"GB-BUECHER","label":"Koordination","kind":"link"},{"from":"GB-RDIR","to":"GB-DOC","label":"Abstimmung","kind":"link"},{"from":"GB-DOC","to":"MT-ERN","label":"MediTeam","kind":"link"},{"from":"GB-DOC","to":"MT-BEW","label":"MediTeam","kind":"link"},{"from":"GB-DOC","to":"MT-SCHLAF","label":"MediTeam","kind":"link"},{"from":"GB-DOC","to":"MT-EVI","label":"MediTeam","kind":"link"},{"from":"WW-COCKPIT","to":"WW-DSCHUNGEL","label":"Wegweiser","kind":"handoff"},{"from":"WW-DSCHUNGEL","to":"WW-BALOO","label":"Führung","kind":"handoff"},{"from":"WW-DSCHUNGEL","to":"WW-MOGLI","label":"Navigation","kind":"handoff"},{"from":"WW-DSCHUNGEL","to":"WW-MONIE","label":"Handel","kind":"handoff"},{"from":"WW-DSCHUNGEL","to":"WW-EDU","label":"Bildung","kind":"handoff"},{"from":"WW-DSCHUNGEL","to":"WW-OPTI","label":"Steuerung","kind":"handoff"},{"from":"WW-COCKPIT","to":"RKW-RI","label":"Scout-Netz","kind":"link"},{"from":"WW-COCKPIT","to":"RKW-UC","label":"Scout-Netz","kind":"link"},{"from":"WW-COCKPIT","to":"RKW-LLE","label":"Scout-Netz","kind":"link"},{"from":"WW-COCKPIT","to":"RKW-SAL","label":"Scout-Netz","kind":"link"},{"from":"WW-COCKPIT","to":"RKW-ML","label":"Scout-Netz","kind":"link"},{"from":"GB-REGIE","to":"WW-COCKPIT","label":"Abstimmung","kind":"link"}]};</script>
  <script src="./vault-collab.js"></script>
  <script>
    function draw(data) {
      const svg = document.getElementById("g");
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      const st = data.stats || {};
      document.getElementById("meta").textContent =
        (data.public_view || "") + "  Knoten " + (st.n_nodes || data.nodes.length) +
        "  Kanten " + (st.n_edges || data.edges.length);
      const W = svg.clientWidth || 900, H = svg.clientHeight || 600;
      const nodes = data.nodes || [];
      const idx = {};
      nodes.forEach((n, i) => { idx[n.id] = i; });
      const order = ["source", "crop", "factor", "prep", "geo", "metric", "agent"];
      const ringOf = n => Math.max(0, order.indexOf(n.group || n.type));
      const pos = nodes.map(n => {
        const ring = ringOf(n);
        const same = nodes.filter(x => ringOf(x) === ring);
        const k = same.indexOf(n);
        const r = 70 + ring * 145;
        const a = (2 * Math.PI * k) / Math.max(same.length, 1) - Math.PI / 2;
        return { x: W / 2 + r * Math.cos(a), y: H / 2 + r * Math.sin(a) };
      });
      (data.edges || []).forEach(e => {
        const a = pos[idx[e.from || e.source]], b = pos[idx[e.to || e.target]];
        if (!a || !b) return;
        const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
        l.setAttribute("x1", a.x); l.setAttribute("y1", a.y);
        l.setAttribute("x2", b.x); l.setAttribute("y2", b.y);
        svg.appendChild(l);
      });
      const avatarFor = function (n) {
        const g = n.group || n.type || "";
        if (g === "agent") return "./avatars/avatar-agent.svg";
        return null;
      };
      nodes.forEach((n, i) => {
        const av = avatarFor(n);
        if (av) {
          const img = document.createElementNS("http://www.w3.org/2000/svg", "image");
          img.setAttribute("href", av);
          img.setAttributeNS("http://www.w3.org/1999/xlink", "href", av);
          img.setAttribute("x", pos[i].x - 14);
          img.setAttribute("y", pos[i].y - 14);
          img.setAttribute("width", 28);
          img.setAttribute("height", 28);
          img.setAttribute("aria-label", n.label || n.id);
          svg.appendChild(img);
        } else {
          const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          c.setAttribute("cx", pos[i].x); c.setAttribute("cy", pos[i].y);
          c.setAttribute("r", 9);
          c.setAttribute("class", n.group || n.type || "");
          svg.appendChild(c);
        }
        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        const dx = pos[i].x - W / 2, dy = pos[i].y - H / 2;
        const ln = Math.hypot(dx, dy) || 1;
        t.setAttribute("x", pos[i].x + (dx / ln) * 22);
        t.setAttribute("y", pos[i].y + (dy / ln) * 16 + 5);
        t.setAttribute("text-anchor", dx < 0 ? "end" : "start");
        t.setAttribute("fill", "#FFF8E8");
        t.setAttribute("font-size", "14");
        t.setAttribute("font-weight", "600");
        t.textContent = n.label || n.id;
        svg.appendChild(t);
      });
    }
    function pick(urls) {
      return urls.reduce((p, u) => p.catch(() => fetch(u).then(r => { if (!r.ok) throw r.status; return r.json(); })), Promise.reject());
    }
    pick(["./vault-graph.json", "/rosary-atlas/vault-graph.json", "/vault-graph.json", "/graph.json"])
      .then(draw)
      .catch(err => { document.getElementById("meta").textContent = String(err); });
  </script>
