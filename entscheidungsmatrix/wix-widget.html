<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Durchblicker und ATLAS Vault</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #f5f5f5; font-family: Rosario, system-ui, sans-serif; }
    header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: #1a1611; border-bottom: 2px solid #d4af37; }
    a { color: #d4af37; }
    .mark { display: flex; gap: 10px; align-items: center; text-decoration: none; color: inherit; }
    .mark strong { color: #d4af37; }
    .shop { margin-left: auto; border: 1px solid #d4af37; color: #d4af37; text-decoration: none; padding: 8px 12px; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <a class="mark" href="https://durchblicker-app.rosary.eu.com/esg-kette.html" target="_blank" rel="noopener">
      <svg width="42" height="42" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#722F37"/>
        <circle cx="32" cy="32" r="24" fill="none" stroke="#D4AF37" stroke-width="3"/>
        <circle cx="32" cy="32" r="6" fill="#D4AF37"/>
        <path d="M32 14v8M32 42v8M14 32h8M42 32h8" stroke="#D4AF37" stroke-width="2"/>
      </svg>
      <span><strong>Durchblicker-App</strong><br><span style="font-size:12px;color:#a38a5c">ESG-Kette öffnen</span></span>
    </a>
    <a class="shop" href="https://rosary.health/product/esg-schranke-a-und-b/" target="_blank" rel="noopener">Zum Shop</a>
  </header>
  <script src="/vault-widget.js"></script>
  <script>
    var btn = document.getElementById("rosary-vault-btn");
    var overlay = document.getElementById("rosary-vault-overlay");
    if (btn) btn.style.display = "none";
    if (overlay) {
      overlay.style.position = "absolute";
      overlay.style.top = "64px";
      overlay.style.right = "0";
      overlay.style.bottom = "0";
      overlay.style.left = "0";
      overlay.style.padding = "0";
      overlay.style.background = "#111";
      var closeBtn = overlay.querySelector("[data-close]");
      if (closeBtn) closeBtn.style.display = "none";
      if (btn) btn.click();
    }
  </script>
</body>
</html>
