<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3D0611"/><stop offset="1" stop-color="#800020"/></linearGradient></defs>
<rect width="1200" height="420" fill="url(#g)"/>
