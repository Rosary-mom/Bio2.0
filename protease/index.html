<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protease-Kette · Magnifica Humanitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rosario:wght@400;700&family=Palanquin:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sand:#e6d3a3;--gold:#d4af37;--bordeaux:#6e1e2a;--ink:#1a120c;--paper:#f7f1e4}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Palatino,"Palatino Linotype",Palatino,serif}
header,main{max-width:920px;margin:0 auto;padding:1.2rem}
header{background:var(--bordeaux);color:var(--sand);display:flex;gap:1rem;align-items:center}
h1,h2{font-family:"Rockwell Extra Bold",Rockwell,"Rosario",serif;font-weight:700;letter-spacing:.02em}
h1{font-size:1.7rem;margin:.2rem 0}
a{color:var(--gold)}
.logo{width:64px;height:64px;flex:none}
.muted{opacity:.8}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7rem}
.card{border:1px solid var(--gold);background:#fffaf1;padding:.8rem}
.star{color:var(--bordeaux);font-family:Rosario,serif;font-weight:700}
button,select,input{background:#fff;color:var(--ink);border:1px solid var(--bordeaux);padding:.4rem;font-family:Rosario,sans-serif}
button{background:var(--bordeaux);color:var(--sand);cursor:pointer}
#log,#bot{white-space:pre-wrap;font-family:Rosario,sans-serif}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<svg class="logo" viewBox="0 0 64 64" aria-label="Rosary">
<circle cx="32" cy="32" r="28" fill="none" stroke="#d4af37" stroke-width="2"/>
<circle cx="32" cy="14" r="3" fill="#e6d3a3"/>
<circle cx="44" cy="20" r="2.4" fill="#e6d3a3"/>
<circle cx="50" cy="32" r="2.4" fill="#e6d3a3"/>
<circle cx="44" cy="44" r="2.4" fill="#e6d3a3"/>
<circle cx="32" cy="50" r="3" fill="#e6d3a3"/>
<circle cx="20" cy="44" r="2.4" fill="#e6d3a3"/>
<circle cx="14" cy="32" r="2.4" fill="#e6d3a3"/>
<circle cx="20" cy="20" r="2.4" fill="#e6d3a3"/>
<path d="M32 22 v20 M24 30 h16" stroke="#d4af37" stroke-width="2"/>
</svg>
<div>
<p class="muted" style="margin:0;font-family:Rosario,sans-serif">Magnifica Humanitas</p>
<h1>Protease-Ereigniskette</h1>
<p style="margin:.2rem 0">Archiv PDB 1SCJ. Gold, Sand, Bordeaux. * klassifiziert, sperrt nicht.</p>
</div>
</header>
<main>
<p><a href="register.html">Register der anderen Themen</a></p>
<div class="grid" id="keys"></div>
<h2>Ursache und Wirkung</h2>
<div id="chain"></div>
<p>
<label>Ursache <input id="cause" value="zweiter Lauf"></label>
<label>Wirkung <input id="effect" value="decision-capable"></label>
<label>Klasse
<select id="cls">
<option>*simulation</option><option>*phi</option><option>*gpu</option><option>*pdb</option><option>*not-eta</option>
</select>
</label>
<button id="add" type="button">Kante setzen</button>
<button id="run" type="button">Lauf</button>
</p>
<div id="log" class="card"></div>
<h2>Grok-Bot, Korpus</h2>
<p class="muted">Antwortet aus dieser Kette. Kein externer Schlüssel, keine Messung.</p>
<input id="q" placeholder="Frage zur Protease-Kette" style="width:70%">
<button id="ask" type="button">Fragen</button>
<div id="bot" class="card"></div>
</main>
<script>
const chain = {"archive":"PDB 1SCJ Subtilisin Carlsberg","keys":{"epistemological":"Annahme, Datenbank, Telemetrie, Messung bleiben getrennt. schutz_faktor 0.8 ist Annahme.","ontological":"Die Struktur ist ein Archivobjekt. Die Kurve ist kein Enzym.","hermeneutical":"Die grüne Fläche liest sich als Pufferbild, nicht als Assay."},"chain":[{"cause":"Trockenstress 0-100","effect":"EM-Aktivität linear runter","class":"*simulation"},{"cause":"schutz_faktor 0.8","effect":"grüne Fläche","class":"*simulation"},{"cause":"Phi-Skala","effect":"Harmonie-Index","class":"*phi"},{"cause":"PDB 1SCJ","effect":"3D-Ansicht Subtilisin","class":"*pdb"}]};
let runs = 1;
const keys = document.getElementById('keys');
for (const [name, text] of Object.entries(chain.keys)) keys.insertAdjacentHTML('beforeend', '<div class="card"><strong>'+name+'</strong><p>'+text+'</p></div>');
function draw(){document.getElementById('chain').innerHTML = chain.chain.map(e => '<div class="card"><span class="star">'+e.class+'</span> '+e.cause+' → '+e.effect+'</div>').join('');}
function aid(){return runs>=2?'decision-capable':'feasibility'}
function log(){document.getElementById('log').textContent='runs '+runs+'\naid '+aid()+'\narchiv '+chain.archive}
document.getElementById('add').onclick=()=>{chain.chain.push({cause:document.getElementById('cause').value,effect:document.getElementById('effect').value,class:document.getElementById('cls').value});draw();};
document.getElementById('run').onclick=()=>{runs+=1;log();};
document.getElementById('ask').onclick=()=>{const q=document.getElementById('q').value.toLowerCase();let a='Aid ist '+aid()+'.';if(q.includes('pdb')||q.includes('archiv'))a=chain.keys.ontological;else if(q.includes('kurve')||q.includes('les'))a=chain.keys.hermeneutical;else if(q.includes('mess')||q.includes('annah'))a=chain.keys.epistemological;else if(q.includes('kette'))a=chain.chain.map(e=>e.class+' '+e.cause+' → '+e.effect).join('; ');document.getElementById('bot').textContent=a;};
draw();log();
</script>
</body>
</html>
